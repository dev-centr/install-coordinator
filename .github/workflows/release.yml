name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            asset: install-coordinator-linux-amd64
          - os: windows-latest
            asset: install-coordinator-windows-amd64.exe
          - os: macos-latest
            asset: install-coordinator-macos-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dlang-community/setup-dlang@v1
        with:
          compiler: ldc-latest
      - run: dub build --config=application --build=release
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/install-coordinator
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp install-coordinator.exe dist/install-coordinator/
            cp -r assets dist/install-coordinator/ 2>/dev/null || true
            (cd dist && zip -r ../${{ matrix.asset }}.zip install-coordinator)
          else
            cp install-coordinator dist/install-coordinator/
            cp -r assets dist/install-coordinator/ 2>/dev/null || true
            tar -czf ${{ matrix.asset }}.tar.gz -C dist install-coordinator
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}.*
          generate_release_notes: true
