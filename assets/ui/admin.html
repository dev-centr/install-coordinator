<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Install Coordinator — Admin</title>
  <link rel="stylesheet" href="/ui/shared.css" />
</head>
<body data-surface="admin">
  <div id="login" class="login hidden">
    <h2>Admin sign-in</h2>
    <p>Remote access requires the coordinator token.</p>
    <input type="password" id="tokenInput" placeholder="Access token" />
    <button id="loginBtn">Sign in</button>
  </div>
  <header>
    <h1>Install Coordinator <span class="badge">Admin</span></h1>
    <div class="strip">
      <label><input type="checkbox" id="lockElev" /> Lock admin for session</label>
      <label><input type="checkbox" id="batchTerms" /> Batch policy acceptance</label>
      <label>Default scope
        <select id="scope">
          <option value="perUser">Per user</option>
          <option value="perMachine">All users (machine)</option>
        </select>
      </label>
      <button id="installAll">Install all ready</button>
      <button class="secondary" id="refresh">Refresh</button>
    </div>
  </header>
  <main>
    <section>
      <h2>Queue</h2>
      <div class="list" id="queue"></div>
    </section>
    <section>
      <h2>History</h2>
      <div class="list" id="history"></div>
    </section>
    <section>
      <h2>Detail</h2>
      <pre id="detail">Select a job…</pre>
      <div class="actions">
        <button class="secondary" id="pinDesktop" disabled>Pin to Desktop</button>
        <button class="secondary" id="pinStart" disabled>Add to Start Menu</button>
        <button class="secondary" id="cancelJob" disabled>Cancel</button>
      </div>
    </section>
    <footer id="status">Connecting…</footer>
  </main>
  <script src="/ui/app.js"></script>
  <script>bootSurface('admin');</script>
</body>
</html>
