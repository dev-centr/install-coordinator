<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Install Coordinator</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
      --ok: #3dd68c;
      --warn: #ffb020;
      --bad: #ff6b6b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .strip {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      align-items: center;
      font-size: 0.9rem;
    }
    label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.45rem 0.85rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.secondary { background: var(--panel); border: 1px solid var(--border); color: var(--text); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    main {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 0;
      min-height: calc(100vh - 72px);
    }
    section {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    section h2 {
      margin: 0;
      padding: 0.75rem 1rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .list { flex: 1; overflow: auto; }
    .item {
      padding: 0.65rem 1rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }
    .item:hover { background: #243044; }
    .item.selected { background: #2a4060; border-left: 3px solid var(--accent); }
    .item .name { font-weight: 500; }
    .item .meta { font-size: 0.8rem; color: var(--muted); margin-top: 0.2rem; }
    .state-done { color: var(--ok); }
    .state-failed, .state-cancelled { color: var(--bad); }
    .state-blocked, .state-executing { color: var(--warn); }
    #detail {
      padding: 1rem;
      font-family: ui-monospace, monospace;
      font-size: 0.78rem;
      white-space: pre-wrap;
      overflow: auto;
      flex: 1;
    }
    .actions { padding: 0.75rem 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; flex-wrap: wrap; }
    footer {
      grid-column: 1 / -1;
      padding: 0.5rem 1rem;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Install Coordinator</h1>
    <div class="strip">
      <label><input type="checkbox" id="lockElev" /> Lock admin for session</label>
      <label><input type="checkbox" id="batchTerms" /> Batch policy acceptance</label>
      <label>Default scope
        <select id="scope">
          <option value="perUser">Per user</option>
          <option value="perMachine">All users (machine)</option>
        </select>
      </label>
      <button id="installAll">Install all ready</button>
      <button class="secondary" id="refresh">Refresh</button>
    </div>
  </header>
  <main>
    <section>
      <h2>Queue</h2>
      <div class="list" id="queue"></div>
    </section>
    <section>
      <h2>History</h2>
      <div class="list" id="history"></div>
    </section>
    <section>
      <h2>Detail</h2>
      <pre id="detail">Select a job…</pre>
      <div class="actions">
        <button class="secondary" id="pinDesktop" disabled>Pin to Desktop</button>
        <button class="secondary" id="pinStart" disabled>Add to Start Menu</button>
        <button class="secondary" id="cancelJob" disabled>Cancel</button>
      </div>
    </section>
    <footer id="status">Connecting…</footer>
  </main>
  <script>
    let selectedId = null;
    let jobs = [];

    async function api(path, opts = {}) {
      const r = await fetch(path, {
        headers: { 'Content-Type': 'application/json' },
        ...opts,
      });
      return r.json();
    }

    function stateClass(s) {
      if (s === 'done') return 'state-done';
      if (s === 'failed' || s === 'cancelled') return 'state-failed';
      if (s === 'blocked' || s === 'executing') return 'state-blocked';
      return '';
    }

    function renderList(el, items, filterFn) {
      el.innerHTML = '';
      items.filter(filterFn).forEach(j => {
        const d = document.createElement('div');
        d.className = 'item' + (j.id === selectedId ? ' selected' : '');
        d.innerHTML = `<div class="name">${escapeHtml(j.displayName || j.id)}</div>
          <div class="meta"><span class="${stateClass(j.state)}">${j.state}</span> · ${escapeHtml(j.statusMessage || '')}</div>`;
        d.onclick = () => selectJob(j.id);
        el.appendChild(d);
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function refresh() {
      const st = await api('/status');
      document.getElementById('status').textContent =
        `MSI lane ${st.msiBusy ? 'busy' : 'free'} · ${st.jobs?.length || 0} active`;
      const all = await api('/jobs');
      jobs = all.jobs || [];
      const active = j => !['done','failed','cancelled'].includes(j.state);
      renderList(document.getElementById('queue'), jobs, active);
      const hist = await api('/catalog');
      renderList(document.getElementById('history'), hist.catalog || [], () => true);
    }

    async function selectJob(id) {
      selectedId = id;
      const j = jobs.find(x => x.id === id) || (await api('/jobs')).jobs?.find(x => x.id === id);
      document.getElementById('detail').textContent = JSON.stringify(j || { id }, null, 2);
      document.getElementById('pinDesktop').disabled = !j?.sourceManifest;
      document.getElementById('pinStart').disabled = !j?.sourceManifest;
      document.getElementById('cancelJob').disabled = !j || ['done','failed','cancelled'].includes(j.state);
      refresh();
    }

    async function pushSession() {
      await api('/session', {
        method: 'POST',
        body: JSON.stringify({
          installForAllUsers: document.getElementById('scope').value === 'perMachine',
          orgPolicyAccepted: document.getElementById('batchTerms').checked,
          lockElevationUntilClose: document.getElementById('lockElev').checked,
          grantElevation: document.getElementById('lockElev').checked,
        }),
      });
    }

    document.getElementById('refresh').onclick = refresh;
    document.getElementById('lockElev').onchange = pushSession;
    document.getElementById('batchTerms').onchange = pushSession;
    document.getElementById('scope').onchange = pushSession;

    document.getElementById('installAll').onclick = async () => {
      const scope = document.getElementById('scope').value;
      for (const j of jobs) {
        if (j.state === 'collecting' || j.state === 'ready') {
          await api(`/jobs/${j.id}/commit`, {
            method: 'POST',
            body: JSON.stringify({ termsAccepted: true, scope }),
          });
        }
      }
      refresh();
    };

    document.getElementById('cancelJob').onclick = async () => {
      if (!selectedId) return;
      await api(`/jobs/${selectedId}/cancel`, { method: 'POST' });
      refresh();
    };

    document.getElementById('pinDesktop').onclick = () => {
      alert('Use CLI: install-coordinator shortcut ' + selectedId + ' --desktop');
    };
    document.getElementById('pinStart').onclick = () => {
      alert('Use CLI: install-coordinator shortcut ' + selectedId + ' --start-menu');
    };

    pushSession();
    refresh();
    setInterval(refresh, 2000);
  </script>
</body>
</html>
